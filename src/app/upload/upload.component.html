<form [formGroup]="form" (ngSubmit)="generateContent()">
  <div class="container mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold mb-8">Upload & Generate</h1>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="border rounded-lg p-6 bg-white shadow-sm">
        <h2 class="text-xl font-semibold mb-4">Upload File</h2>

        <div 
          class="border-2 border-dashed rounded-lg p-8 mb-6 flex flex-col items-center justify-center text-center transition-all cursor-pointer"
          [class.border-blue-500]="isDragging"
          [class.bg-blue-50]="isDragging"
          (dragover)="onDragOver($event)" 
          (dragleave)="onDragLeave()" 
          (drop)="onDrop($event)"
          (click)="fileInput.click()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500 mb-4">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" x2="12" y1="3" y2="15"></line>
          </svg>

          <p class="mb-2 text-gray-700">
            Drag & drop your files here, or <span class="text-blue-600 font-bold hover:underline">browse</span>
          </p>
          <p class="text-xs text-gray-400 uppercase tracking-wide">Supports TXT, MP3, MP4 (Max 50MB)</p>

          <input 
            #fileInput
            type="file" 
            class="hidden" 
            (change)="onFileSelected($event)"
            accept=".txt,.mp3,.mp4,.wav,.avi,.mov"
          >
        </div>

        <div *ngIf="selectedFile" class="mb-6 p-3 bg-blue-50 rounded-lg border border-blue-100 flex items-center justify-between animate-in fade-in duration-300">
          <div class="flex items-center gap-3">
            <span class="text-2xl">📄</span>
            <div class="overflow-hidden">
              <p class="text-sm font-semibold text-gray-800 truncate max-w-[180px]">{{ selectedFile.name }}</p>
              <p class="text-xs text-gray-500">{{ selectedFile.size / 1024 | number:'1.0-1' }} KB</p>
            </div>
          </div>
          <button type="button" (click)="removeFile()" class="text-gray-400 hover:text-red-500 transition-colors p-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <div class="space-y-5">
          <div>
            <label for="outputType" class="block text-sm font-semibold text-gray-700 mb-2">Output Type</label>
            <div class="relative">
              <select 
                id="outputType" 
                formControlName="outputType"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-md appearance-none focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none bg-white text-gray-700"
              >
                <option value="userStories">User Stories</option>
                <option value="testCases">Test Cases</option>
                <option value="socialMedia">Social Media Post</option>
                <option value="customFormat">Custom Format</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </div>
            </div>
          </div>

          <div>
            <label for="instructions" class="block text-sm font-semibold text-gray-700 mb-2">Additional Instructions (Optional)</label>
            <textarea 
              id="instructions" 
              formControlName="additionalInstructions"
              placeholder="e.g. Write in a professional tone..." 
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all resize-none"
              rows="4"
            ></textarea>
          </div>

          <button 
            type="submit"
            [disabled]="!selectedFile || form.invalid"
            class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold rounded-md transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-[0.98]"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
            Generate Content
          </button>
        </div>
      </div>

      <div class="border rounded-lg p-6 bg-white shadow-sm flex flex-col h-full">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">Generated Output</h2>
        
        <div *ngIf="!generatedContent" class="flex-grow flex flex-col items-center justify-center text-gray-400 text-center p-8 border-2 border-dotted border-gray-100 rounded-xl bg-gray-50/50">
          <div class="bg-white p-4 rounded-full shadow-sm mb-4">
            <span class="text-4xl">✨</span>
          </div>
          <p class="max-w-[200px]">Upload a file and let AI do the heavy lifting.</p>
        </div>

        <div *ngIf="generatedContent" class="flex-grow overflow-auto p-5 border border-gray-200 rounded-xl bg-gray-50 shadow-inner">
          <pre class="whitespace-pre-wrap font-mono text-sm text-gray-700 leading-relaxed">{{ generatedContent }}</pre>
        </div>
      </div>
    </div>
  </div>
</form>
